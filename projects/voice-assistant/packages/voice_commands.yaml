# Voice commands HA's built-in Assist sentences do not cover: fan speed
# presets, AC on/off and AC temperature. Loaded as an HA package
# (bind-mounted to /config/packages by docker-compose.yml). Speech-to-Phrase
# reads these sentence triggers from HA when it trains, so a sentence added
# here needs `docker restart speech-to-phrase` before it can be heard. A
# {wildcard} also needs a same-named list in custom_sentences/en/. "A C" is
# there because Speech-to-Phrase spells initialisms out letter by letter.
automation:
  - id: voice_ac_on_off
    alias: "Voice: AC on/off"
    triggers:
      - trigger: conversation
        id: "on"
        command:
          - "turn on [the] (AC|A C|air conditioner)"
          - "switch on [the] (AC|A C|air conditioner)"
          - "set [the] (AC|A C|air conditioner) [mode] to cool[ing] [mode]"
          - "(AC|A C|air conditioner) [on] cool[ing] [mode]"
          - "cool[ing] mode [on]"
      - trigger: conversation
        id: "off"
        command:
          - "turn off [the] (AC|A C|air conditioner)"
          - "switch off [the] (AC|A C|air conditioner)"
    # Set a mode, not climate.turn_on: the MirAIe AC (Node-RED bridge) ignores
    # a bare turn_on - no change in 40s on 2026-10-10 - but set_hvac_mode
    # cool switches it on at once. "on" means cool, the only mode used.
    actions:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.panasonic_ac_panasonic_ac
        data:
          hvac_mode: "{{ 'cool' if trigger.id == 'on' else 'off' }}"
      - set_conversation_response: "AC {{ trigger.id }}"

  - id: voice_ac_temperature
    alias: "Voice: AC temperature"
    triggers:
      - trigger: conversation
        command:
          - "set [the] (AC|A C|air conditioner) [temperature] to {temperature} [degrees]"
          - "(AC|A C|air conditioner) [to] {temperature} [degrees]"
    # {temperature} is a wildcard here, so "set the AC to cool" and "AC cool
    # mode" land in this automation too: treat any "cool" as AC on.
    variables:
      raw: "{{ trigger.slots.temperature | string | lower }}"
      temperature: "{{ trigger.slots.temperature | int(0) }}"
    actions:
      - if: "{{ 'cool' in raw }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.panasonic_ac_panasonic_ac
            data:
              hvac_mode: cool
          - set_conversation_response: "AC on"
          - stop: "cool mode"
      - if: "{{ 16 <= temperature <= 30 }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: climate.panasonic_ac_panasonic_ac
            data:
              temperature: "{{ temperature }}"
          - set_conversation_response: "AC set to {{ temperature }} degrees"
        else:
          - set_conversation_response: "The AC only goes from 16 to 30 degrees"

  # Trigger id is "<fan entity>|<preset>". A bare "fan" means the bedroom fan.
  - id: voice_fan_speed
    alias: "Voice: fan speed"
    triggers:
      - trigger: conversation
        id: "fan.bedroom_fan_2|High"
        command: "[set] [the] [bedroom] fan [speed] [to] (high|fast|full)"
      - trigger: conversation
        id: "fan.bedroom_fan_2|Medium"
        command: "[set] [the] [bedroom] fan [speed] [to] medium"
      - trigger: conversation
        id: "fan.bedroom_fan_2|Low"
        command: "[set] [the] [bedroom] fan [speed] [to] (low|slow)"
      - trigger: conversation
        id: "fan.living_room_fan|High"
        command: "[set] [the] (hall|living room) fan [speed] [to] (high|fast|full)"
      - trigger: conversation
        id: "fan.living_room_fan|Medium"
        command: "[set] [the] (hall|living room) fan [speed] [to] medium"
      - trigger: conversation
        id: "fan.living_room_fan|Low"
        command: "[set] [the] (hall|living room) fan [speed] [to] (low|slow)"
    variables:
      fan: "{{ trigger.id.split('|')[0] }}"
      preset: "{{ trigger.id.split('|')[1] }}"
    actions:
      - action: fan.turn_on
        target:
          entity_id: "{{ fan }}"
        data:
          preset_mode: "{{ preset }}"
      - set_conversation_response: "{{ 'Hall' if fan == 'fan.living_room_fan' else 'Bedroom' }} fan {{ preset | lower }}"

  # "Everything" means lights and fans - never the AC or the white noise, so a
  # bedtime "turn off everything" cannot kill either (user, 2026-10-28). Plain
  # "everything" / "all lights" is the room of the satellite that heard it, by
  # its HA area; "in the house" is every room; naming a room ("turn off [the]
  # bedroom", "...living room|hall") is that room from any satellite. "All
  # lights" leaves the fans on. A command with no satellite behind it (the
  # phone app) has no room, so it falls back to the whole house. HA's built-in
  # "turn off everything" only reaches light.* entities, and these are all
  # Tinxy switch.*, so without this it matched and did nothing.
  # Trigger id is "<scope>|<what>": scope here/house/bedroom/living_room,
  # what all/lights.
  - id: voice_all_off
    alias: "Voice: turn off everything"
    triggers:
      - trigger: conversation
        id: "here|all"
        command:
          - "(turn|switch) off everything [here|in here]"
          - "(turn|switch) everything off"
      - trigger: conversation
        id: "house|all"
        command:
          - "(turn|switch) off everything in [the] (house|home)"
          - "(turn|switch) everything off in [the] (house|home)"
      - trigger: conversation
        id: "here|lights"
        command:
          - "(turn|switch) off all [the] lights [here|in here]"
          - "(turn|switch) all [the] lights off"
      - trigger: conversation
        id: "house|lights"
        command:
          - "(turn|switch) off all [the] lights in [the] (house|home)"
      - trigger: conversation
        id: "bedroom|all"
        command:
          - "(turn|switch) off [everything in] [the] bedroom"
          - "(turn|switch) [the] bedroom off"
      - trigger: conversation
        id: "living_room|all"
        command:
          - "(turn|switch) off [everything in] [the] (living room|hall)"
          - "(turn|switch) [the] (living room|hall) off"
    variables:
      rooms:
        bedroom: [switch.bedroom_tubelight, switch.bedroom_led_bulb_2, switch.bedroom_balcony, fan.bedroom_fan_2]
        living_room: [switch.living_room_tubelight, switch.living_room_shelf_led, fan.living_room_fan]
      scope: "{{ trigger.id.split('|')[0] }}"
      what: "{{ trigger.id.split('|')[1] }}"
      area: >-
        {{ scope if scope in rooms else
           (area_id(trigger.device_id) if scope == 'here' and trigger.device_id else '') }}
      whole: "{{ area not in rooms }}"
      chosen: "{{ rooms.bedroom + rooms.living_room if whole else rooms[area] }}"
      targets: "{{ chosen | select('match', 'switch\\.') | list if what == 'lights' else chosen }}"
    actions:
      - action: homeassistant.turn_off
        target:
          entity_id: "{{ targets }}"
      - set_conversation_response: >-
          Turned off {{ 'all the lights' if what == 'lights' else 'everything' }}
          {{- ' in the house' if whole else ' in the ' ~ area_name(area) | lower }}

  # The one command that must work while white noise plays (user,
  # 2026-11-15). HA's built-ins understood "turn off white noise" but sent
  # "stop white noise" to a lawn mower (HassLawnMowerDock, 2026-11-15).
  # "stop the noise" sits next to "stop the song" (pause) - drop it if the two
  # get confused in the bench test (plan-room-replies.md step 1).
  - id: voice_white_noise_off
    alias: "Voice: stop white noise"
    triggers:
      - trigger: conversation
        command:
          - "(stop|turn off|switch off) [the] white noise"
          - "white noise (off|stop)"
          - "stop the noise"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.white_noise
      - set_conversation_response: "White noise off"

  # Spotify playback by voice. media_player.spotify_pramod is the Spotify
  # integration's account-wide player. "play <song>" is generated from the
  # library into packages/spotify_songs.yaml by spotify_library.py. No bare
  # "play [the] music" here: it would compete with "play {song}". Only
  # multi-word forms ("pause the music", "next song") until a day of debug
  # recordings shows the bare words don't turn up in false wakes
  # (plan-room-replies.md Design 9).
  #
  # Room guard (user, 2026-11-18): said on a satellite, these act only on the
  # music in that satellite's room - the playing device is our own record of
  # what we last started when it is newer than Spotify's (HA skips quick
  # refreshes), else spotify_pramod's source. Otherwise they say where the
  # music is. Never resume/skip the bedroom's player while white noise is on.
  # From the phone app (no satellite) they act on whatever plays, as before.
  # Music-starting forms go through script.voice_start_music, so a failure
  # says "Couldn't ..." instead of HA's "Done"; on success they set the
  # room's voice_music_started_ flag and the spoken reply is skipped (the
  # music is the answer, user 2026-11-18).
  # Trigger id is the action, or "vol|<delta>" / "volset".
  - id: voice_spotify_control
    alias: "Voice: Spotify pause/resume/skip/volume"
    triggers:
      - trigger: conversation
        id: pause
        command:
          - "(pause|stop) [the] (music|song|spotify)"
      - trigger: conversation
        id: resume
        command:
          - "(resume|continue|unpause) [the] (music|song|spotify)"
      - trigger: conversation
        id: next
        command:
          - "(next|skip [the]|skip this) (song|track)"
          - "play [the] next (song|track)"
      - trigger: conversation
        id: previous
        command:
          - "(previous|last) (song|track)"
          - "play [the] (previous|last) (song|track)"
      - trigger: conversation
        id: "vol|0.1"
        command:
          - "(music|spotify) volume up"
          - "(turn|make) [the] (music|spotify) (up|louder)"
      - trigger: conversation
        id: "vol|-0.1"
        command:
          - "(music|spotify) volume down"
          - "(turn|make) [the] (music|spotify) (down|quieter|softer)"
      # HA matches {music_volume} as free text, so a bare "music volume
      # {music_volume}" also swallowed "music volume up" (as the default 50).
      - trigger: conversation
        id: volset
        command:
          - "set [the] (music|spotify) volume to {music_volume} [percent]"
    variables:
      player: media_player.spotify_pramod
      now_vol: "{{ state_attr('media_player.spotify_pramod', 'volume_level') | float(0.5) }}"
      devices: {bedroom: raspberrypi, living_room: xero}
      names: {raspberrypi: the bedroom, xero: the living room}
      area: "{{ area_id(trigger.device_id) if trigger.device_id else '' }}"
      here: "{{ devices.get(area, '') }}"
      music_on: >-
        {% set sp = states.media_player.spotify_pramod %}
        {% set rec = states('input_text.voice_music_device') %}
        {% set rec_t = as_timestamp(states('input_datetime.voice_music_started_at'), 0) %}
        {% if rec not in ['', 'unknown', 'unavailable'] and sp and rec_t > as_timestamp(sp.last_updated) %}{{ rec }}
        {% elif sp and sp.state in ['playing', 'paused'] %}{{ sp.attributes.source | default('') }}
        {% endif %}
      refuse: >-
        {% set m = music_on | trim %}
        {% if here and m != here %}{{ 'Nothing is playing' if not m else 'The music is in ' ~ names[m] if m in names else 'The music is on ' ~ m }}
        {% elif m == 'raspberrypi' and trigger.id in ['resume', 'next', 'previous']
                and not is_state('switch.white_noise', 'off') %}White noise is on
        {% endif %}
    actions:
      - if: "{{ refuse | trim != '' }}"
        then:
          - set_conversation_response: "{{ refuse | trim }}"
          - stop: refused
      - choose:
          - conditions: "{{ trigger.id.startswith('vol|') }}"
            sequence:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ player }}"
                data:
                  volume_level: "{{ [[now_vol + trigger.id.split('|')[1] | float, 0] | max, 1] | min | round(2) }}"
              - set_conversation_response: "Music volume {{ 'up' if trigger.id.split('|')[1] | float > 0 else 'down' }}"
          - conditions: "{{ trigger.id == 'volset' }}"
            sequence:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ player }}"
                data:
                  volume_level: "{{ ([trigger.slots.music_volume | int(50), 100] | min) / 100 }}"
              - set_conversation_response: "Music volume {{ [trigger.slots.music_volume | int(50), 100] | min }} percent"
          - conditions: "{{ trigger.id == 'pause' }}"
            sequence:
              - if: "{{ area in devices }}"
                then:
                  - action: input_boolean.turn_off
                    target: {entity_id: "input_boolean.voice_paused_{{ area }}"}
              - action: input_text.set_value
                target: {entity_id: input_text.voice_music_device}
                data: {value: ""}
              # Already paused when the wake word paused it: still "Paused".
              - if: "{{ not is_state(player, 'paused') }}"
                then:
                  - action: media_player.media_pause
                    target: {entity_id: "{{ player }}"}
                    continue_on_error: true
              - set_conversation_response: Paused
        default:
          - action: script.voice_start_music
            data:
              action: "{{ trigger.id }}"
              device: "{{ music_on | trim }}"
            response_variable: started
            continue_on_error: true
          - if: "{{ (started | default({})).get('ok', false) }}"
            then:
              - if: "{{ area in devices }}"
                then:
                  # next/previous keep voice_paused_: the wake word's pause
                  # is still in place and voice_resume brings the music back.
                  - if: "{{ trigger.id == 'resume' }}"
                    then:
                      - action: input_boolean.turn_off
                        target: {entity_id: "input_boolean.voice_paused_{{ area }}"}
                  - action: input_boolean.turn_on
                    target: {entity_id: "input_boolean.voice_music_started_{{ area }}"}
              - set_conversation_response: >-
                  {{ {'resume': 'Resuming', 'next': 'Next song', 'previous': 'Previous song'}[trigger.id] }}
            else:
              - set_conversation_response: >-
                  Couldn't {{ {'resume': 'resume the music', 'next': 'skip the song',
                               'previous': 'go back a song'}[trigger.id] }}

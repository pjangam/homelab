# Living room voice satellite: the second ESP32 + its own INMP441, wired as
# wiring.html. Flashed 2026-10-24, in HA (area Living Room) since 2026-10-28.
# Everything but the name, address and API key is in voice-satellite-common.yaml.
# Build and flash from the Mac: build_on_mac.sh living
substitutions:
  name: voice-living-room
  friendly_name: Voice Living Room
  static_ip: 192.168.1.126
  num_leds: "8"

packages:
  common: !include voice-satellite-common.yaml

api:
  encryption:
    key: !secret api_key_living_room

# Voice satellite: the aarti-lights ESP32 + INMP441, reflashed from WLED to
# ESPHome (projects/voice-assistant/README.md, wiring.html). Original ESP32,
# so no on-device wake word: it streams audio to HA continuously and the
# pipeline's openWakeWord (on xero) listens for the wake word.
# Build/flash from the repo root with projects/voice-assistant/esphome/esphome.sh
substitutions:
  name: voice-satellite

esphome:
  name: ${name}
  friendly_name: Voice Satellite
  on_boot:
    priority: -100
    then:
      - light.turn_on: { id: status, brightness: 30%, effect: "Slow blink" }

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - voice_assistant.start_continuous:
    - light.turn_off: status
  on_client_disconnected:
    - voice_assistant.stop:
    - light.turn_on: { id: status, brightness: 30%, effect: "Slow blink" }

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Same address the board had as WLED (docs/hardware.md, wled-sound)
  manual_ip:
    static_ip: 192.168.1.125
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.123
    dns2: 192.168.1.124  # secondary Pi-hole on the wol Pi
  ap:
    password: !secret ap_password

captive_portal:

# INMP441, same pins as the aarti build: SD=32, WS=25, SCK=33, L/R to GND
# (= left channel). It sends 24-bit samples in 32-bit slots.
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO33

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO32
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000

voice_assistant:
  id: va
  microphone: mic
  use_wake_word: true
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_wake_word_detected:
    - light.turn_on: { id: status, brightness: 100%, effect: none }
  on_stt_vad_end:
    - light.turn_on: { id: status, brightness: 100%, effect: "Fast blink" }
  on_end:
    - light.turn_off: status
  on_error:
    - light.turn_on: { id: status, brightness: 100%, effect: "Fast blink" }
    - delay: 2s
    - light.turn_off: status
  # A pipeline error ends the continuous loop; restart it unless HA is gone.
  on_client_disconnected:
    - voice_assistant.stop:

# Onboard blue LED (GPIO2 on most ESP32 dev boards) as the status light until
# the WS2812 stick is wired: slow blink = not connected to HA, solid = heard
# the wake word / listening, fast blink = processing or error, off = idle.
output:
  - platform: ledc
    pin:
      number: GPIO2
      ignore_strapping_warning: true  # onboard LED; harmless at boot
    id: led_out

light:
  - platform: monochromatic
    output: led_out
    id: status
    name: Status LED
    effects:
      - pulse:
          name: Slow blink
          transition_length: 1s
          update_interval: 1s
      - strobe:
          name: Fast blink
          colors:
            - { state: true, brightness: 100%, duration: 150ms }
            - { state: false, duration: 150ms }

# Living room voice satellite: the aarti-lights ESP32 + INMP441, reflashed
# from WLED to ESPHome. 192.168.1.125 is the address it had as WLED
# (docs/hardware.md, wled-sound). Name kept as voice-satellite so HA's
# device and entities stay as they are.
# Everything but the name, address and API key is in voice-satellite-common.yaml.
# Build and flash from the Mac: build_on_mac.sh
substitutions:
  name: voice-satellite
  friendly_name: Voice Satellite
  static_ip: 192.168.1.125

packages:
  common: !include voice-satellite-common.yaml

api:
  encryption:
    key: !secret api_key

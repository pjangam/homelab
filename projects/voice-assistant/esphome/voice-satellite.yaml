# The first voice satellite: the aarti-lights ESP32 + INMP441, reflashed from
# WLED to ESPHome, at 192.168.1.125 (its WLED address, docs/hardware.md).
# Which room it serves is its HA area (Bedroom since 2026-10-06), not this
# file. Keep it away from the white-noise speaker: the hiss drowns out
# commands even when the wake word gets through (tested 2026-10-06).
# Name kept as voice-satellite so HA's device and entities stay as they are.
# Everything but the name, address and API key is in voice-satellite-common.yaml.
# Build and flash from the Mac: build_on_mac.sh
substitutions:
  name: voice-satellite
  friendly_name: Voice Satellite
  static_ip: 192.168.1.125
  # 7, not 8: one LED cut off on 2026-10-28 after its solder pads were damaged.
  num_leds: "7"

packages:
  common: !include voice-satellite-common.yaml

api:
  encryption:
    key: !secret api_key

# SHT40 temperature/humidity sensor (tracker/humidity-dry-mode.md), bedroom
# board only. On a ~30cm lead outside the box: the ESP32 warms its enclosure
# and would read high temperature and low humidity. VIN -> 3V3, GND -> GND,
# SDA -> GPIO21, SCL -> GPIO19 (not the default SCL 22, kept for the
# speaker amp's DIN). The breakout's own pull-ups are enough at 100kHz.
# Safe to flash before it is wired: the sensor just reads unavailable.
# The heater stays off (the default): it would skew the readings.
i2c:
  sda: GPIO21
  scl: GPIO19
  frequency: 100kHz

sensor:
  - platform: sht4x
    temperature:
      name: Bedroom temperature
    humidity:
      name: Bedroom humidity
    update_interval: 60s

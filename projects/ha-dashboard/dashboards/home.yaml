# Home - the curated dashboard, next to Overview rather than instead of it.
# Overview stays the complete, auto-updating index; this one holds only what
# gets acted on. First cut 2026-09-24 from touched_entities.py (user-initiated
# state changes over the recorder's 10 days); re-run it to see what has
# drifted. The verbatim copy of Overview this replaced is commit b833b4d.
#
# YAML mode: edit, refresh the browser, check with shot_dashboard.sh.

views:
- title: Home
  icon: mdi:home
  path: overview
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: binary_sensor.homelab_healthcheck_homelab_overall_status
    name: Homelab
    show_name: true
    tap_action:
      action: navigate
      navigation_path: /dashboard-stats
  - type: entity
    entity: binary_sensor.homelab_healthcheck_homelab_power_watchdog
    name: Power
    show_name: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Bedroom
      icon: mdi:bed
    - type: tile
      entity: scene.ojaswi_sleeping
      name: Sleeping
      tap_action: {action: toggle}
    - type: tile
      entity: scene.ojaswi_awake
      name: Awake
      tap_action: {action: toggle}
    - type: tile
      entity: switch.bedroom_led_bulb_2
      name: LED bulb
      tap_action: {action: toggle}
    - type: tile
      entity: switch.bedroom_tubelight
      name: Tubelight
      tap_action: {action: toggle}
    - type: tile
      entity: fan.bedroom_fan_2
      name: Fan
      tap_action: {action: toggle}
    - type: tile
      entity: switch.white_noise
      name: White noise
      tap_action: {action: toggle}
    - type: tile
      entity: switch.bedroom_balcony
      name: Balcony
      tap_action: {action: toggle}
    - type: tile
      entity: climate.panasonic_ac_panasonic_ac
      name: AC
      grid_options: {columns: 12}
      features:
      - type: target-temperature

  - type: grid
    cards:
    - type: heading
      heading: Living room
      icon: mdi:sofa
    - type: tile
      entity: fan.living_room_fan
      name: Fan
      tap_action: {action: toggle}
    - type: tile
      entity: switch.living_room_tubelight
      name: Tubelight
      tap_action: {action: toggle}
    - type: tile
      entity: switch.living_room_shelf_led
      name: Shelf LED
      tap_action: {action: toggle}
    - type: heading
      heading: Aarti lights
      icon: mdi:led-strip-variant
    - type: tile
      entity: light.wled
      name: WLED
      grid_options: {columns: 12}
      tap_action: {action: toggle}
      features:
      - type: light-brightness
    - type: tile
      entity: script.aarti_lights_on
      name: Aarti on
      tap_action: {action: toggle}
    - type: tile
      entity: script.aarti_lights_off
      name: Aarti off
      tap_action: {action: toggle}

  - type: grid
    cards:
    - type: heading
      heading: Music
      icon: mdi:music
    - type: media-control
      entity: media_player.spotify_pramod
    - type: tile
      entity: number.server_volume
      name: Speaker volume
      grid_options: {columns: 12}
      features:
      - type: numeric-input
        style: slider
    - type: tile
      entity: script.play_bedroom_track
      name: Bedroom track
      grid_options: {columns: 12}
      tap_action: {action: toggle}

# Home - tracked copy of the storage-mode (UI-editable) Home dashboard at
# /dashboard-home. Started 2026-09-22 as a verbatim copy of Overview.
# Edit in the HA UI, then `projects/ha-dashboard/ui_dashboard.py export` and
# commit; `ui_dashboard.py restore` pushes this file back into HA.
views:
- icon: mdi:home
  path: overview
  type: sections
  max_columns: 3
  sections:
  - column_span: 3
    type: grid
    cards:
    - type: heading
      heading: Favorites
      heading_style: title
      visibility:
      - condition: view_columns
        min: 2
      grid_options:
        rows: auto
    - type: tile
      entity: sensor.system_monitor_processor_temperature
      state_content:
      - state
      - area_name
      show_entity_picture: true
    - type: tile
      entity: sensor.system_monitor_processor_use
      state_content:
      - state
      - area_name
      show_entity_picture: true
    - type: tile
      entity: sensor.system_monitor_memory_free
      state_content:
      - state
      - area_name
      show_entity_picture: true
    - type: tile
      entity: scene.ojaswi_sleeping
      state_content:
      - state
      - area_name
      show_entity_picture: true
    - type: tile
      entity: scene.ojaswi_awake
      state_content:
      - state
      - area_name
      show_entity_picture: true
    - type: tile
      entity: fan.bedroom_fan_2
      state_content:
      - state
      - area_name
      show_entity_picture: true
    - type: tile
      entity: switch.white_noise
      state_content:
      - state
      - area_name
      show_entity_picture: true
    - type: tile
      entity: switch.bedroom_tubelight
      state_content:
      - state
      - area_name
      show_entity_picture: true
    - type: tile
      entity: number.server_volume
      state_content:
      - state
      - area_name
      show_entity_picture: true
  - type: grid
    column_span: 3
    visibility:
    - condition: view_columns
      max: 1
    cards:
    - type: heading
      heading: Summaries
      heading_style: title
    - type: repairs
      hide_empty: true
      tap_action:
        action: navigate
        navigation_path: /config/repairs?historyBack=1
      grid_options:
        columns: 6
    - type: updates
      hide_empty: true
      tap_action:
        action: navigate
        navigation_path: /config/updates?historyBack=1
      grid_options:
        columns: 6
    - type: discovered-devices
      hide_empty: true
      grid_options:
        columns: 6
    - type: home-summary
      summary: light
      tap_action:
        action: navigate
        navigation_path: /light?historyBack=1
      grid_options:
        columns: 6
    - type: home-summary
      summary: climate
      tap_action:
        action: navigate
        navigation_path: /climate?historyBack=1
      grid_options:
        columns: 6
    - type: home-summary
      summary: maintenance
      tap_action:
        action: navigate
        navigation_path: /maintenance?historyBack=1&backPath=/home
      grid_options:
        columns: 6
    - type: tile
      entity: weather.forecast_home
      name: Weather
      state_content:
      - temperature
      - state
      grid_options:
        columns: 6
    - type: shortcut
      tap_action:
        action: navigate
        navigation_path: /config/automation
      grid_options:
        columns: 6
    - type: shortcut
      tap_action:
        action: navigate
        navigation_path: /config/scene
      grid_options:
        columns: 6
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Areas
      heading_style: title
    - type: area
      area: living_room
      display_type: compact
      sensor_classes: []
      tap_action:
        action: navigate
        navigation_path: areas-living_room
      vertical: true
      grid_options:
        rows: 2
        columns: 4
    - type: area
      area: kitchen
      display_type: compact
      sensor_classes: []
      tap_action:
        action: navigate
        navigation_path: areas-kitchen
      vertical: true
      grid_options:
        rows: 2
        columns: 4
    - type: area
      area: bedroom
      display_type: compact
      sensor_classes: []
      tap_action:
        action: navigate
        navigation_path: areas-bedroom
      vertical: true
      grid_options:
        rows: 2
        columns: 4
    - type: tile
      entity: zone.home
      vertical: true
      name: Devices
      icon: mdi:devices
      hide_state: true
      tap_action:
        action: navigate
        navigation_path: other-devices
      grid_options:
        rows: 2
        columns: 4
  header:
    layout: responsive
    card:
      type: markdown
      text_only: true
      content: '## Welcome {{ user }}'
  sidebar:
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Summaries
        heading_style: title
        grid_options:
          rows: auto
      - type: repairs
        hide_empty: true
        tap_action:
          action: navigate
          navigation_path: /config/repairs?historyBack=1
        grid_options:
          columns: 12
      - type: updates
        hide_empty: true
        tap_action:
          action: navigate
          navigation_path: /config/updates?historyBack=1
        grid_options:
          columns: 12
      - type: discovered-devices
        hide_empty: true
        grid_options:
          columns: 12
      - type: home-summary
        summary: light
        tap_action:
          action: navigate
          navigation_path: /light?historyBack=1
        grid_options:
          columns: 12
      - type: home-summary
        summary: climate
        tap_action:
          action: navigate
          navigation_path: /climate?historyBack=1
        grid_options:
          columns: 12
      - type: home-summary
        summary: maintenance
        tap_action:
          action: navigate
          navigation_path: /maintenance?historyBack=1&backPath=/home
        grid_options:
          columns: 12
      - type: tile
        entity: weather.forecast_home
        name: Weather
        state_content:
        - temperature
        - state
        grid_options:
          columns: 12
      - type: shortcut
        tap_action:
          action: navigate
          navigation_path: /config/automation
        grid_options:
          columns: 12
      - type: shortcut
        tap_action:
          action: navigate
          navigation_path: /config/scene
        grid_options:
          columns: 12
    visibility:
    - condition: view_columns
      min: 2
- title: Living Room
  path: areas-living_room
  subview: true
  type: sections
  header:
    badges_position: bottom
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Lights
      icon: mdi:lamps
      tap_action:
        action: navigate
        navigation_path: /light?historyBack=1
      badges:
      - type: button
        icon: mdi:power
        text: 'Off'
        tap_action:
          action: perform-action
          perform_action: light.turn_on
          target:
            area_id: living_room
        visibility:
        - condition: not
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity: light.wled
              state: 'on'
            - condition: state
              entity: light.wled_main
              state: 'on'
            - condition: state
              entity: light.wled_segment_1
              state: 'on'
            - condition: state
              entity: light.wled_segment_2
              state: 'on'
      - type: button
        icon: mdi:power
        color: orange
        text: 'On'
        tap_action:
          action: perform-action
          perform_action: light.turn_off
          target:
            area_id: living_room
        visibility:
        - condition: or
          conditions:
          - condition: state
            entity: light.wled
            state: 'on'
          - condition: state
            entity: light.wled_main
            state: 'on'
          - condition: state
            entity: light.wled_segment_1
            state: 'on'
          - condition: state
            entity: light.wled_segment_2
            state: 'on'
    - type: tile
      entity: light.wled
      features:
      - type: light-brightness
    - type: tile
      entity: light.wled_main
      features:
      - type: light-brightness
    - type: tile
      entity: light.wled_segment_1
      features:
      - type: light-brightness
    - type: tile
      entity: light.wled_segment_2
      features:
      - type: light-brightness
  - type: grid
    cards:
    - type: heading
      heading: Climate
      icon: mdi:home-thermometer
      tap_action:
        action: navigate
        navigation_path: /climate?historyBack=1
    - type: tile
      entity: fan.living_room_fan
      name: Fan
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading_style: subtitle
      heading: ''
  - type: grid
    cards:
    - type: heading
      heading: Living Room
      tap_action:
        action: navigate
        navigation_path: /config/devices/device/17bd8c7bd0fa85e5f92976d7e5b332d2
      badges: []
    - type: tile
      entity: switch.living_room_tubelight
      name:
        type: entity
    - type: tile
      entity: switch.living_room_shelf_led
      name:
        type: entity
    - type: tile
      entity: switch.living_room_blank
      name:
        type: entity
  - type: grid
    cards:
    - type: heading
      heading: WLED
      tap_action:
        action: navigate
        navigation_path: /config/devices/device/cfccff4406a5b20cf364ba04f6956e50
      badges: []
    - type: tile
      entity: select.wled_playlist
      name:
        type: entity
    - type: tile
      entity: select.wled_preset

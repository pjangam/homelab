server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy always talks to this container over plain HTTP (see
    # services/caddy/Caddyfile), so nginx's own default scheme-guessing would bake
    # "http://" into any redirect Location header even when the real
    # inbound request was https - breaking the /projects redirect below
    # once it's reverse-proxied. Emitting a scheme-relative Location
    # instead lets the client resolve it against whatever scheme it
    # actually used.
    absolute_redirect off;

    # The project files (tracker/<slug>.md) are served via `alias` from a
    # directory bind mount (see docker-compose.yml's `.:/data:ro`), not baked
    # into the image, so an edit shows on the next page load. A single-file
    # bind mount would pin the container to the original inode, and editors
    # that save via atomic replace swap it, silently freezing the view.
    #
    # The app first fetches the directory itself: `autoindex_format json` gives
    # it the file list ([{"name":..., "type":"file"}, ...]), then it fetches
    # each file. Both locations: the app's base is /projects/ (see
    # ../vite.config.js) so it works behind Caddy, and plain :8125 hits too.
    location /tracker/ {
        alias /data/tracker/;
        autoindex on;
        autoindex_format json;
    }

    location /projects/tracker/ {
        alias /data/tracker/;
        autoindex on;
        autoindex_format json;
    }

    location = /projects {
        return 301 /projects/;
    }

    location /projects/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /projects/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}

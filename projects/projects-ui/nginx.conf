server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy always talks to this container over plain HTTP (see
    # ../../Caddyfile), so nginx's own default scheme-guessing would bake
    # "http://" into any redirect Location header even when the real
    # inbound request was https - breaking the /projects redirect below
    # once it's reverse-proxied. Emitting a scheme-relative Location
    # instead lets the client resolve it against whatever scheme it
    # actually used.
    absolute_redirect off;

    # PROJECTS.md is served via `alias` from a directory bind mount (see
    # docker-compose.yml's `.:/data:ro`), not baked into the image and not a
    # single-file bind mount. A single-file bind mount pins the container to
    # the original file's inode - editors that save via atomic replace (write
    # temp file, rename over the original) swap the inode, silently freezing
    # the container's view of the file until it's restarted. A directory bind
    # mount resolves the path fresh on every request, so it isn't affected.
    location = /PROJECTS.md {
        alias /data/PROJECTS.md;
    }

    # App build's `base` is /projects/ (see ../vite.config.js) so it also
    # works reverse-proxied under that path by Caddy (see ../../Caddyfile),
    # not just accessed directly on :8125 - `alias` strips the /projects/
    # prefix back off before looking the file up on disk.
    location = /projects/PROJECTS.md {
        alias /data/PROJECTS.md;
    }

    location = /projects {
        return 301 /projects/;
    }

    location /projects/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /projects/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}

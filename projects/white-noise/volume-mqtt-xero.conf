# systemd drop-in for volume-mqtt.service ON XERO: its own HA slider for
# xero's speaker (USB card 1, control Speaker), next to the wol Pi's
# "Server Volume". Installed as a copy:
#   mkdir -p ~/.config/systemd/user/volume-mqtt.service.d
#   cp projects/white-noise/volume-mqtt-xero.conf ~/.config/systemd/user/volume-mqtt.service.d/xero.conf
#   systemctl --user daemon-reload && systemctl --user enable --now volume-mqtt
[Service]
Environment=VOLUME_ID=xero "VOLUME_NAME=xero Speaker Volume" VOLUME_CARD=1 VOLUME_CONTROL=Speaker VOLUME_MAX=100

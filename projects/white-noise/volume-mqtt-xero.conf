# systemd drop-in for volume-mqtt.service ON XERO: its own HA slider for
# xero's speaker, next to the wol Pi's "Pi Speaker Volume". Since 2026-11-14
# the speaker is the Portronics Apollo One over Bluetooth, so the slider drives
# PipeWire's default sink (amixer -D pipewire Master), not USB card 1.
# Installed as a copy:
#   mkdir -p ~/.config/systemd/user/volume-mqtt.service.d
#   cp projects/white-noise/volume-mqtt-xero.conf ~/.config/systemd/user/volume-mqtt.service.d/xero.conf
#   systemctl --user daemon-reload && systemctl --user enable --now volume-mqtt
[Service]
Environment=VOLUME_ID=xero "VOLUME_NAME=xero Speaker Volume" VOLUME_DEVICE=pipewire VOLUME_CONTROL=Master VOLUME_MAX=100

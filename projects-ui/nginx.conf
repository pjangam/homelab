server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PROJECTS.md is served via `alias` from a directory bind mount (see
    # docker-compose.yml's `.:/data:ro`), not baked into the image and not a
    # single-file bind mount. A single-file bind mount pins the container to
    # the original file's inode - editors that save via atomic replace (write
    # temp file, rename over the original) swap the inode, silently freezing
    # the container's view of the file until it's restarted. A directory bind
    # mount resolves the path fresh on every request, so it isn't affected.
    location = /PROJECTS.md {
        alias /data/PROJECTS.md;
    }

    location / {
        try_files $uri /index.html;
    }
}

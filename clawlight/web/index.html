<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawlight</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0d;
    font-family: -apple-system, system-ui, sans-serif;
    color: #eee;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #light {
    width: min(70vw, 320px);
    height: min(70vw, 320px);
    border-radius: 50%;
    transition: background-color 0.3s ease;
    box-shadow: 0 0 60px 10px currentColor;
  }
  #label {
    font-size: 1.4rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #sublabel {
    font-size: 0.85rem;
    color: #999;
  }
  button {
    font-size: 1rem;
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1a1a1e;
    color: #eee;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #unsupported { font-size: 0.9rem; color: #888; max-width: 280px; text-align: center; }
  /* The PiP source video must stay in the layout (not display:none) or
     Chromium silently refuses to actually create the floating window even
     though requestPictureInPicture() resolves - so hide it visually instead. */
  #pip-video {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="light"></div>
  <div id="label">connecting…</div>
  <div id="sublabel"></div>
  <button id="float-btn">Float</button>
  <div id="unsupported" hidden>
    Picture-in-Picture isn't supported in this browser - the light still updates on this page.
  </div>

  <canvas id="canvas" width="60" height="220" hidden></canvas>
  <video id="pip-video" muted playsinline></video>

<script>
const COLORS = {
  active:  { css: '#22c55e', label: 'active' },
  waiting: { css: '#ef4444', label: 'needs input' },
  idle:    { css: '#6b7280', label: 'idle' },
};

const lightEl = document.getElementById('light');
const labelEl = document.getElementById('label');
const sublabelEl = document.getElementById('sublabel');
const floatBtn = document.getElementById('float-btn');
const unsupportedEl = document.getElementById('unsupported');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('pip-video');

let currentState = 'idle';
let currentSessions = [];
let videoTrack = null; // set once the capture stream exists; drawCanvas() pushes frames through it

function applyState(data) {
  const state = COLORS[data.state] ? data.state : 'idle';
  currentState = state;
  currentSessions = data.sessions || [];
  const { css, label } = COLORS[state];
  lightEl.style.backgroundColor = css;
  lightEl.style.color = css;
  labelEl.textContent = label;

  sublabelEl.innerHTML = '';
  if (currentSessions.length) {
    currentSessions.forEach((s) => {
      const row = document.createElement('div');
      row.textContent = `${s.host}/${s.label}: ${COLORS[s.state] ? COLORS[s.state].label : s.state}`;
      sublabelEl.appendChild(row);
    });
  } else {
    sublabelEl.textContent = 'no active sessions';
  }

  drawCanvas();
}

function drawCanvas() {
  // Thin vertical bar - solid color fill, like the LED it's standing in for.
  const { css } = COLORS[currentState];
  ctx.fillStyle = css;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Identify which console(s) are driving this color (e.g. which one needs
  // input when red) - too narrow at 60px for horizontal text, so rotate it
  // to run the long way down the bar.
  const relevant = currentSessions.filter((s) => s.state === currentState);
  if (relevant.length) {
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const lines = relevant.slice(0, 3).map((s) => `${s.host}:${s.label}`);
    const maxLen = canvas.height - 12; // available run length after rotation

    // Shrink the font (not canvas's maxWidth squish, which distorts text)
    // until the longest line actually fits, down to a readable floor -
    // below that, truncate with an ellipsis instead of going illegible.
    let fontSize = 13;
    const fits = (size) => {
      ctx.font = `bold ${size}px sans-serif`;
      return Math.max(...lines.map((l) => ctx.measureText(l).width));
    };
    while (fontSize > 7 && fits(fontSize) > maxLen) fontSize--;
    ctx.font = `bold ${fontSize}px sans-serif`;

    const displayLines = lines.map((line) => {
      if (ctx.measureText(line).width <= maxLen) return line;
      let truncated = line;
      while (ctx.measureText(truncated + '…').width > maxLen && truncated.length > 1) {
        truncated = truncated.slice(0, -1);
      }
      return truncated + '…';
    });

    const lineHeight = fontSize + 4;
    const startOffset = -((displayLines.length - 1) * lineHeight) / 2;
    displayLines.forEach((line, i) => {
      ctx.fillText(line, 0, startOffset + i * lineHeight);
    });
    ctx.restore();
  }

  if (videoTrack) videoTrack.requestFrame();
}

async function fetchStatus() {
  try {
    const res = await fetch('/clawlight/api/status', { cache: 'no-store' });
    applyState(await res.json());
  } catch (e) {
    labelEl.textContent = 'unreachable';
  }
}

function connectEvents() {
  const source = new EventSource('/clawlight/api/events');
  source.onmessage = (ev) => applyState(JSON.parse(ev.data));
  source.onerror = () => {
    source.close();
    setTimeout(connectEvents, 3000);
  };
}

if (!('pictureInPictureEnabled' in document)) {
  floatBtn.hidden = true;
  unsupportedEl.hidden = false;
} else {
  // Set the video playing as soon as the page loads (muted autoplay needs no
  // user gesture), not inside the button handler. iOS Safari drops the "this
  // came from a real tap" flag if anything is awaited before
  // requestPictureInPicture() - even `await video.play()` - and throws
  // AbortError. So by the time the button is clicked, the video is already
  // playing and the click handler calls requestPictureInPicture() with no
  // awaits ahead of it.
  //
  // captureStream(0) means "no automatic frame timer" - we push frames
  // ourselves via videoTrack.requestFrame() from drawCanvas(). This gets the
  // video its first frame (and real dimensions) immediately instead of
  // waiting up to one frame interval, which otherwise races a fast click:
  // Chromium refuses PiP with "video element is not ready" until the video
  // has valid loaded metadata.
  const stream = canvas.captureStream(0);
  videoTrack = stream.getVideoTracks()[0];
  video.srcObject = stream;
  video.play().catch(() => {}); // autoplay may be deferred; harmless either way
  drawCanvas(); // pushes the first frame now that videoTrack exists

  floatBtn.disabled = true;
  video.addEventListener('loadedmetadata', () => { floatBtn.disabled = false; }, { once: true });

  floatBtn.addEventListener('click', () => {
    if (floatBtn.disabled) return; // a request is already in flight
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(() => {});
      return;
    }
    // Only one PiP request may be in flight at a time - the browser throws if
    // a second call overlaps the first. Disable the button for the duration.
    floatBtn.disabled = true;
    video.requestPictureInPicture()
      .catch((e) => {
        unsupportedEl.textContent = 'Could not start Picture-in-Picture: ' + e.message;
        unsupportedEl.hidden = false;
      })
      .finally(() => { floatBtn.disabled = false; });
  });
  video.addEventListener('leavepictureinpicture', () => {
    floatBtn.textContent = 'Float';
  });
  document.addEventListener('enterpictureinpicture', () => {
    floatBtn.textContent = 'Stop floating';
    unsupportedEl.hidden = true;
  });
}

fetchStatus();
connectEvents();
</script>
</body>
</html>

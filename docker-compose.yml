# Shared shape for the Tailscale sidecars that give a service its own tailnet
# hostname and an auto-renewing HTTPS cert, without touching Caddy. Used by
# ha-tailscale and ntfy-tailscale below; the only per-service differences are
# the auth key, the hostname, the state volume and the config dir.
#
# Why sidecars at all: xero already runs its own native tailscaled via systemd,
# so these cannot use network_mode: host (would conflict) - hence userspace mode.
#
# The cert is the real payoff. `tailscale serve` provisions and RENEWS the
# cert itself inside the container's state volume, unlike the static files in
# certs/ that Caddy serves with auto_https off and that nothing rotates.
x-tailscale-sidecar: &tailscale-sidecar
  image: tailscale/tailscale:latest
  restart: unless-stopped

x-tailscale-sidecar-env: &tailscale-sidecar-env
  TS_STATE_DIR: /var/lib/tailscale
  TS_USERSPACE: "true"
  TS_SERVE_CONFIG: /config/serve-config.json

services:
  ### photos servers start — disabled: 8GB RAM insufficient to run Immich alongside other services

  ### photos servers end

  ###pihole start
  # More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
  #services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port (admin UI — Caddy handles HTTPS on 443)
      - "8081:80/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: "Asia/Kolkata"
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
      FTLCONF_dns_listeningMode: "all"
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - "./etc-pihole:/etc/pihole"
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped
  ###pihole end

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "8080:80"  # access at http://<LAN-IP>:8080
    volumes:
      - ./vw-data:/data
    environment:
      WEBSOCKET_ENABLED: 'true'
      SIGNUPS_ALLOWED: 'false'
      DOMAIN: 'https://xero.${TAILNET_SUFFIX}'
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./HOMEASSISTANT_CONFIG:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host

  # Gives HA its own clean Tailscale hostname/cert (ha.${TAILNET_SUFFIX})
  # without touching Caddy (which still only serves Vaultwarden). Runs in
  # userspace networking mode - xero already runs its own native tailscaled
  # via systemd, so this can't use network_mode: host (would conflict).
  # HA itself is unmoved (network_mode: host, 192.168.1.123:8123); this
  # sidecar reaches it over the LAN, same as any other client would.
  ha-tailscale:
    <<: *tailscale-sidecar
    container_name: ha-tailscale
    hostname: ha
    environment:
      <<: *tailscale-sidecar-env
      TS_AUTHKEY: ${TS_AUTHKEY_HA}
      TS_HOSTNAME: ha
    volumes:
      - ha-tailscale-state:/var/lib/tailscale
      # Proxies to HA over the LAN (192.168.1.123:8123) rather than by container
      # name, because HA runs with network_mode: host and so isn't on this
      # compose network. Rendered by scripts/render_ts_serve_config.sh.
      - ./ts-ha-config:/config

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  # node-red moved to the Pi (wol-sender, 192.168.1.124) - see PROJECTS.md
  # "Move some load to the Raspberry Pi". Mosquitto stays here; the Pi's
  # Node-RED reaches it over the LAN via the published 1883 port above.

  caddy:
    image: caddy:latest
    container_name: caddy
    network_mode: host
    environment:
      - TAILNET_SUFFIX=${TAILNET_SUFFIX}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_SCHEDULE=0 0 4 * * 0  # Sundays at 4am
      - WATCHTOWER_CLEANUP=true           # remove old images after update
      - WATCHTOWER_INCLUDE_STOPPED=false
      - DOCKER_API_VERSION=1.40
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=generic+http://192.168.1.123:8123/api/webhook/watchtower_update
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Read-only dashboard view of PROJECTS.md - React app built at image-build
  # time, PROJECTS.md itself mounted read-only so edits show up on refresh
  # without rebuilding the image. LAN-only, same pattern as pihole/vaultwarden.
  projects-ui:
    build:
      context: ./projects-ui
    container_name: projects-ui
    restart: unless-stopped
    ports:
      - "8125:80"  # access at http://<LAN-IP>:8125
    volumes:
      # Whole repo root, read-only - nginx.conf only actually serves
      # /PROJECTS.md from it (see projects-ui/nginx.conf for why this is a
      # directory mount rather than a single-file one).
      - .:/data:ro

  # Self-hosted push notifications (PROJECTS.md "iOS push notifications").
  # Bound to loopback only: the tailnet path in is the sidecar below, and
  # 127.0.0.1:8127 is for publishers running on xero itself (clawlight), which
  # keeps basic-auth credentials off the LAN in plaintext.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:8127:80"
    environment:
      # Must match the URL entered in the mobile app exactly - iOS instant
      # delivery derives its upstream topic hash from this value.
      NTFY_BASE_URL: "https://ntfy.${TAILNET_SUFFIX}"
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    networks:
      default:
        aliases:
          # The sidecar must reach this container by a name that is NOT "ntfy".
          # ntfy-tailscale sets hostname: ntfy for its tailnet identity, which
          # registers "ntfy" in Docker's embedded DNS pointing at the SIDECAR -
          # so http://ntfy:80 from inside the sidecar resolves to itself and
          # returns connection refused (a 502 out of tailscale serve). On top of
          # that, tailscaled writes "search <tailnet> / ndots:0" into the
          # sidecar's resolv.conf, so bare names can resolve via MagicDNS before
          # Docker DNS. A distinct alias avoids both traps.
          - ntfy-server

  ntfy-tailscale:
    <<: *tailscale-sidecar
    container_name: ntfy-tailscale
    hostname: ntfy
    environment:
      <<: *tailscale-sidecar-env
      TS_AUTHKEY: ${TS_AUTHKEY_NTFY}
      TS_HOSTNAME: ntfy
    volumes:
      - ntfy-tailscale-state:/var/lib/tailscale
      # Unlike ha-tailscale, this proxies to the ntfy container by service name
      # over the compose network - ntfy isn't host-networked, so it needs no
      # LAN-exposed port at all.
      - ./ts-ntfy-config:/config
    depends_on:
      - ntfy

  samba:
    image: dperson/samba
    container_name: samba
    restart: unless-stopped
    ports:
      - "139:139"
      - "445:445"
    environment:
      # Files land on disk owned by smbuser regardless of which login
      # authenticated - this is what actually controls on-disk uid/gid,
      # not the uid/gid fields on the -u flag below (those only set the
      # phoneupload login's own uid in the container's /etc/passwd).
      USERID: 1000
      GROUPID: 1000
    volumes:
      - ${PHONE_UPLOADS_LOCATION}:/share
    command:
      - "-p"
      - "-u"
      - "${SAMBA_USER};${SAMBA_PASSWORD};1000;1000;1000"
      - "-s"
      - "phone-uploads;/share;yes;no;no;${SAMBA_USER};;;iPhone video drop zone"

volumes:
  # model-cache:  # immich-machine-learning — disabled
  # node-red-data: no longer declared here (node-red moved to the Pi) - the
  # actual volume (homelab_node-red-data) is left in place on disk as a
  # rollback net; not deleted yet.
  mosquitto-data:
  mosquitto-log:
  ntfy-cache:
  ntfy-auth:
  ntfy-tailscale-state:
  caddy_data:
  caddy_config:
  ha-tailscale-state:

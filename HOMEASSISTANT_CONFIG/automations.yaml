- id: watchtower_update_notification
  alias: Watchtower Container Update
  description: Notify when Watchtower updates a container
  triggers:
  - trigger: webhook
    webhook_id: watchtower_update
    allowed_methods:
    - POST
    local_only: true
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      title: 'Homelab: Container Updated'
      message: '{{ trigger.data.keys() | list | first | default(''Watchtower updated
        one or more containers'') }}'
  mode: single
- id: '1781541854232'
  alias: Ojaswi sleeping
  description: ''
  triggers:
  - trigger: tag
    tag_id: ''
  conditions: []
  actions:
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.ojaswi_sleeping
    data:
      transition: 30
  mode: single
- id: '1782193994691'
  alias: Ojaswi awake
  description: ''
  triggers:
  - trigger: tag
    tag_id: ''
  conditions: []
  actions:
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.ojaswi_awake

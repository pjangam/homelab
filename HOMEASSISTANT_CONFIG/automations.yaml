- id: watchtower_update_notification
  alias: Watchtower Container Update
  description: Notify when Watchtower updates a container
  triggers:
  - trigger: webhook
    webhook_id: watchtower_update
    allowed_methods:
    - POST
    local_only: true
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      title: 'Homelab: Container Updated'
      message: '{{ trigger.data.keys() | list | first | default(''Watchtower updated
        one or more containers'') }}'
  mode: single
- id: '1781541854232'
  alias: Ojaswi sleeping
  description: ''
  triggers:
  - trigger: tag
    tag_id: ''
  conditions: []
  actions:
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.ojaswi_sleeping
    data:
      transition: 30
  mode: single
- id: '1782193994691'
  alias: Ojaswi awake
  description: ''
  triggers:
  - trigger: tag
    tag_id: ''
  conditions: []
  actions:
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.ojaswi_awake
    data:
      transition: 30
  mode: single
- id: '1782905381664'
  alias: oju_asleep
  description: ''
  triggers:
  - trigger: event
    event_type: ''
    event_data:
      oju_asleep: 'true'
  conditions: []
  actions:
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.ojaswi_sleeping
    data: {}
  mode: single
- id: white_noise_night_auto_off
  alias: White noise auto-off at night
  description: Safety net in case white noise is left on overnight - checked at four times rather than once, so a single missed trigger doesn't leave it running all night.
  triggers:
  - trigger: time
    at: '23:00:00'
  - trigger: time
    at: '23:30:00'
  - trigger: time
    at: '00:00:00'
  - trigger: time
    at: '00:30:00'
  conditions:
  - condition: state
    entity_id: switch.white_noise
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.white_noise
  mode: single

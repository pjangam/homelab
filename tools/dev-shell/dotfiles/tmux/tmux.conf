# Lines installed into ~/.tmux.conf by tools/dev-shell/setup-tmux-shell.sh, inside a
# managed block. Edit here and re-run the script; anything you add to
# ~/.tmux.conf outside that block is left alone.

# New panes and windows open in the directory the current pane is in.
# (Since tmux 1.9 they default to the session's start directory instead.)
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Mouse OFF, which is tmux's own default, and the reason is selection. With
# mouse on, tmux switches the terminal into mouse-reporting mode, so iTerm hands
# every drag to tmux and never makes a selection of its own. tmux's selection is
# not iTerm's: Cmd-C is handled inside iTerm and never reaches tmux, so with
# mouse on there is nothing for Cmd-C to copy, and tmux's own drag-end has to
# choose between clearing the highlight or leaving it live and letting the next
# scroll drag it wider. Neither is what a selection is supposed to do.
#
# Off, all of that is just iTerm: drag highlights, the highlight stays until you
# click away, Cmd-C copies it, and Cmd-F, double-click-a-word and URL clicking
# work normally too.
#
# What off costs, and how to get it back:
#   - click-to-focus-pane and drag-the-border-to-resize stop working. Use the
#     prefix: `o` and arrows to move, `C-arrow` to resize, `z` to zoom one pane
#     full-screen (which also makes an iTerm drag safe to do in a split).
#   - the wheel scrolls iTerm's scrollback, not the pane's history. For one
#     pane that is usually what you wanted anyway; in a split it is wrong,
#     because iTerm sees the whole terminal and drags across both panes. Use
#     prefix `[` there - that is per-pane and reads tmux's full history-limit.
#   - prefix `g` grabs the mouse back for tmux for as long as you need it, and
#     gives it back on a second press, saying which way it went. (`g` because
#     stock tmux already uses both `m` and `M` for marking a pane, which
#     swap-pane needs.) The copy-mode bindings below are for that mode.
set -g mouse off
bind g set -g mouse \; display 'mouse #{?mouse,ON - tmux takes the drag; Option-drag for iTerm,OFF - iTerm selection + Cmd-C}'

# OSC 52, so a copy made inside tmux (prefix `[`, select, Enter) still reaches
# the system clipboard rather than staying in tmux's own buffer. Needs iTerm's
# "Applications in terminal may access clipboard" (Preferences > General >
# Selection), which is already on here.
set -g set-clipboard on

# The iTerm tab/window title says which tmux session this is, rather than
# "tmux". set-titles is off by default, so tmux never writes a title at all and
# iTerm falls back to showing the running command's name. A grouped session's
# own name carries a `-N` suffix, so the group name wins - the one you typed,
# and the same one claude-tmux-name.zsh gives the Claude Code session and
# clawlight shows on the page.
set -g set-titles on
set -g set-titles-string "#{?session_group,#{session_group},#S}"

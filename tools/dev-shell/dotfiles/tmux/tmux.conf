# Lines installed into ~/.tmux.conf by tools/dev-shell/setup-tmux-shell.sh, inside a
# managed block. Edit here and re-run the script; anything you add to
# ~/.tmux.conf outside that block is left alone.

# New panes and windows open in the directory the current pane is in.
# (Since tmux 1.9 they default to the session's start directory instead.)
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Mouse on: drag a pane border to resize, click to select a pane or window,
# scroll to enter copy-mode. tmux >= 2.1.
#
# The cost, and it is the one this setup otherwise works hard to avoid: with
# mouse on, tmux captures mouse events, so dragging no longer makes an iTerm
# selection and copy-paste stops working the usual way. That is the same
# complaint CLAUDE_CODE_DISABLE_MOUSE_CLICKS=1 exists to fix in
# dotfiles/zsh/claude-tmux.zsh, so the two settings below buy it back rather
# than leaving the trade half-made:
#   - hold Option (Alt) while dragging for a native iTerm selection, bypassing
#     tmux entirely - the escape hatch that always works, including for text
#     that has scrolled off into the pane's history.
#   - a tmux drag-select now copies to the system clipboard over OSC 52, so the
#     common case needs no modifier at all. Needs iTerm's
#     "Applications in terminal may access clipboard" (Preferences > General >
#     Selection); without it the copy is tmux-local and Option-drag is the way.
set -g mouse on
set -g set-clipboard on

# Copy the drag selection without also clearing it and snapping to the bottom,
# which is what the default MouseDragEnd binding does and makes a mis-drag cost
# you your scroll position.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

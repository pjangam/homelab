# Lines installed into ~/.tmux.conf by tools/dev-shell/setup-tmux-shell.sh, inside a
# managed block. Edit here and re-run the script; anything you add to
# ~/.tmux.conf outside that block is left alone.

# New panes and windows open in the directory the current pane is in.
# (Since tmux 1.9 they default to the session's start directory instead.)
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Mouse ON, because in tmux that is the only thing that scrolls.
#
# It is worth writing down why, because the alternative looks available and is
# not. Two facts pull against each other:
#   - wheel events reach tmux only when mouse is on.
#   - iTerm makes a selection of its own, the kind Cmd-C can copy, only when
#     mouse is off. Cmd-C is handled inside iTerm and never reaches tmux, so
#     with mouse on there is nothing for it to copy.
#
# So mouse off buys native selection and Cmd-F, and costs the wheel entirely.
# The obvious escape - let iTerm's own scrollback take over - does not exist:
# tmux draws inside a DECSTBM scroll region (CSI 1;23r above a bottom status
# line, CSI 1;24r with the status off), and a terminal discards lines that
# scroll out of a region rather than pushing them to scrollback. Dropping
# smcup/rmcup so tmux stays off the alternate screen is not enough either; the
# region is still set. probe_tmux_scrollback.py measures all of this against a
# real pty, and both were tried here before settling on mouse on.
#
# The way out of that bind is on iTerm's side, not here: Profiles > Terminal >
# mouse reporting ON, report wheel events ON, report clicks & drags OFF. tmux
# asks for the mouse, iTerm hands it only the wheel and keeps clicks and drags
# for its own selection. So the wheel scrolls tmux history (copy-mode) while a
# plain drag is a native iTerm selection that Cmd-C copies, and nothing jumps
# to the bottom when it ends - tmux never saw the drag. The profile setting
# covers ssh too, so a remote tmux with mouse on behaves the same.
#
# The cost: no click-to-focus a pane or drag-to-resize, and an iTerm selection
# runs across side-by-side panes (prefix `z` to zoom one first).
#
# Prefix `g` still flips tmux's side, saying which way it went. (`g` rather
# than `m`: stock tmux uses `m` and `M` for pane marking, which swap-pane
# needs.)
set -g mouse on
bind g set -g mouse \; display 'mouse #{?mouse,ON - wheel scrolls tmux history,OFF - wheel sends arrow keys; no scrolling}'

# For when iTerm does report clicks and drags (another profile, or the setting
# flipped back): a drag, double- or triple-click copies and then stops
# selecting, rather than the stock copy-and-cancel. The copy stays highlighted
# and copy-mode stays where it was scrolled to - no jump to the bottom - and
# the highlight no longer grows as you scroll on. It lasts until Escape or the
# next selection; a plain click leaves it alone. Bound in both key tables so
# mode-keys emacs and vi behave the same.
#
# Escape in the emacs table is stock `cancel`, which would throw away the
# selection and the scroll position together; here it clears a selection
# first and only leaves copy-mode on a second press. The vi table already
# binds Escape to clear-selection.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-no-clear \; send -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear \; send -X stop-selection
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection-no-clear \; send -X stop-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection-no-clear \; send -X stop-selection
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection-no-clear \; send -X stop-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection-no-clear \; send -X stop-selection
bind -T copy-mode Escape if -F '#{selection_present}' 'send -X clear-selection' 'send -X cancel'

# OSC 52, so a copy made inside tmux (prefix `[`, select, Enter) still reaches
# the system clipboard rather than staying in tmux's own buffer. Needs iTerm's
# "Applications in terminal may access clipboard" (Preferences > General >
# Selection), which is already on here.
set -g set-clipboard on

# The iTerm tab/window title says which tmux session this is, rather than
# "tmux". set-titles is off by default, so tmux never writes a title at all and
# iTerm falls back to showing the running command's name. A grouped session's
# own name carries a `-N` suffix, so the group name wins - the one you typed,
# and the same one claude-tmux-name.zsh gives the Claude Code session and
# clawlight shows on the page.
set -g set-titles on
set -g set-titles-string "#{?session_group,#{session_group},#S}"

# Lines installed into ~/.tmux.conf by tools/dev-shell/setup-tmux-shell.sh, inside a
# managed block. Edit here and re-run the script; anything you add to
# ~/.tmux.conf outside that block is left alone.

# New panes and windows open in the directory the current pane is in.
# (Since tmux 1.9 they default to the session's start directory instead.)
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Mouse on: drag a pane border to resize, click to select a pane or window,
# scroll to enter copy-mode. tmux >= 2.1.
#
# The cost, and it is the one this setup otherwise works hard to avoid: with
# mouse on, tmux captures mouse events, so dragging no longer makes an iTerm
# selection and copy-paste stops working the usual way. That is the same
# complaint CLAUDE_CODE_DISABLE_MOUSE_CLICKS=1 exists to fix in
# dotfiles/zsh/claude-tmux.zsh, so the two settings below buy it back rather
# than leaving the trade half-made:
#   - hold Option (Alt) while dragging for a native iTerm selection, bypassing
#     tmux entirely - the escape hatch that always works, including for text
#     that has scrolled off into the pane's history.
#   - a tmux drag-select now copies to the system clipboard over OSC 52, so the
#     common case needs no modifier at all. Needs iTerm's
#     "Applications in terminal may access clipboard" (Preferences > General >
#     Selection); without it the copy is tmux-local and Option-drag is the way.
set -g mouse on
set -g set-clipboard on

# Dragging a selection puts the pane into copy-mode, which is modal: the pane
# freezes on its history and keys stop reaching the program underneath until you
# press q. Neither stock drag-end binding is right in both cases - tmux's default
# (copy-selection-and-cancel) leaves at once but snaps to the live bottom, so a
# selection made while scrolled back costs you your place; copy-selection-no-clear
# keeps your place but strands you in copy-mode after *every* selection, which
# under Claude Code looks like the pane hanging mid-answer.
#
# So pick per case. scroll_position is 0 when the pane is at the live bottom and
# non-zero when it is scrolled back:
#   - at the bottom, grabbing something you can see: copy and leave immediately,
#     there is no scroll position left to lose.
#   - scrolled back, reading history: copy and stay where you are.
#
# Both branches end the selection the moment the mouse comes up. Note the
# scrolled-back one is copy-selection, NOT copy-selection-no-clear: no-clear
# leaves the selection live, so the next scroll goes on dragging it wider and
# highlighted text trails you up the pane. Plain copy-selection clears it while
# still staying in copy-mode, which is the half of no-clear that was wanted.
bind -T copy-mode    MouseDragEnd1Pane if -F -t = '#{scroll_position}' 'send -t = -X copy-selection' 'send -t = -X copy-selection-and-cancel'
bind -T copy-mode-vi MouseDragEnd1Pane if -F -t = '#{scroll_position}' 'send -t = -X copy-selection' 'send -t = -X copy-selection-and-cancel'

# The way out of a copy-mode you stayed in, other than q: scroll back down to the
# bottom. tmux's own wheel binding enters copy-mode with -e, which does exactly
# that, but its drag binding enters without it - so a selection left you in a
# copy-mode the wheel alone could never get you out of. This is the stock root
# binding with the -e added.
bind -T root MouseDrag1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -eM'

# The iTerm tab/window title says which tmux session this is, rather than
# "tmux". set-titles is off by default, so tmux never writes a title at all and
# iTerm falls back to showing the running command's name. A grouped session's
# own name carries a `-N` suffix, so the group name wins - the one you typed,
# and the same one claude-tmux-name.zsh gives the Claude Code session and
# clawlight shows on the page.
set -g set-titles on
set -g set-titles-string "#{?session_group,#{session_group},#S}"

# copyparty config for albums-gallery (services/albums/README.md).
# The secret path prefix (--rp-loc) stays on the command line in
# docker-compose.yml because it comes from .env. Accounts are in the
# gitignored accounts.conf, managed by services/albums/uploader.sh.

% /cfg-albums/accounts.conf

[global]
  hist: /cache
  no-robots
  th-mt: 1
  # Real client IPs arrive in X-Forwarded-For from the albums-tailscale
  # sidecar; trust it only from the private compose network, so that the
  # wrong-password ban (default 9 in 60 min) bans the guesser, not everyone.
  xff-src: lan
  rproxy: -1

# The album: everyone with the link can view and download. Mounted :ro.
[/]
  /w
  accs:
    r: *
  flags:
    grid

# Review-first inbox. Uploaders can add files but not list, read, move or
# delete anything; viewers without a login do not see it at all. Nothing here
# reaches the album until review.sh approves it.
[/upload]
  /inbox
  accs:
    w: @acct
  flags:
    e2d                     # upload db (in /cache tmpfs); the xau hook needs it
    dthumb                  # never decode untrusted files for thumbnails
    nosub                   # no folders, everything lands flat
    nohtml                  # belt and braces: never serve html/markdown as a page
    noscript
    sz: 1k-4g               # a long phone video can be a few GB
    df: 50g                 # stop accepting uploads before datapool gets tight
    maxb: 30g,86400         # per client IP per day
    maxn: 500,3600          # per client IP per hour
    xbu: c,j,/hooks/pre_upload.py
    xau: c,j,/hooks/post_upload.py

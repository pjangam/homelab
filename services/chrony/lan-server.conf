# Dropped into /etc/chrony/conf.d/ on xero by services/chrony/deploy.sh.
# Ubuntu's stock /etc/chrony/chrony.conf still supplies the upstream pools,
# rtcsync and makestep; this file only adds the LAN-server half.

# Answer NTP for the LAN. The wol-sender Pi is the client that matters: it has
# no RTC, so after a power cut it boots on its last saved time and cannot
# correct it until something answers.
allow 192.168.1.0/24

# Keep answering when the internet is down. xero has a battery-backed RTC, so
# its own clock is a good reference through an ISP outage; without this chrony
# refuses to serve until it has reached an upstream server - which is exactly
# the case (2026-09-28: power cut + ISP outage, Pi 15min behind for 10h) this
# exists for. Stratum 10 so any real upstream source always wins.
local stratum 10

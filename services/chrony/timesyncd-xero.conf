# Installed on the wol-sender Pi as /etc/systemd/timesyncd.conf.d/xero.conf by
# services/chrony/deploy.sh.
#
# xero first, then the internet pool. Listed in NTP= rather than FallbackNTP=
# on purpose: timesyncd only consults FallbackNTP when NTP= is empty, so
# putting the pool there would leave the Pi with no source at all whenever
# xero is down. In NTP= it rotates to the next server when one stops answering.
[Time]
NTP=192.168.1.123 0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org
